<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0D0F12" />

  <!-- Verbindingslijnen -->
  <g stroke="#0066FF" stroke-width="3" opacity="0.6">
    <line x1="400" y1="225" x2="200" y2="120" />
    <line x1="400" y1="225" x2="600" y2="120" />
    <line x1="400" y1="225" x2="200" y2="330" />
    <line x1="400" y1="225" x2="600" y2="330" />
  </g>

  <!-- Actieve Oranje Datastroom -->
  <line x1="400" y1="225" x2="600" y2="120" stroke="#FF6B00" stroke-width="4" stroke-dasharray="8 6" />

  <!-- Central Router Node -->
  <circle cx="400" cy="225" r="35" fill="#161B22" stroke="#00F0FF" stroke-width="4" />
  <circle cx="400" cy="225" r="15" fill="#00F0FF" />

  <!-- Outer Nodes -->
  <circle cx="200" cy="120" r="25" fill="#161B22" stroke="#0066FF" stroke-width="3" />
  <circle cx="600" cy="120" r="25" fill="#161B22" stroke="#FF6B00" stroke-width="4" />
  <circle cx="200" cy="330" r="25" fill="#161B22" stroke="#0066FF" stroke-width="3" />
  <circle cx="600" cy="330" r="25" fill="#161B22" stroke="#0066FF" stroke-width="3" />
</svg>
