<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F12" />
      <stop offset="50%" stop-color="#121824" />
      <stop offset="100%" stop-color="#0D0F12" />
    </linearGradient>

    <linearGradient id="rack-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0066FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="orange-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#FF6B00" stop-opacity="1" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Effects -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="550" fill="url(#bg-glow)" />

  <!-- Grid Perspective Lines (Floor & Ceiling Grid) -->
  <g stroke="#0066FF" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="50" x2="1000" y2="50" />
    <line x1="0" y1="500" x2="1000" y2="500" />
    <path d="M 0,500 L 1000,500 M 100,500 L 200,550 M 300,500 L 400,550 M 500,500 L 600,550 M 700,500 L 800,550" />
    <path d="M 0,50 L 1000,50 M 100,50 L 200,0 M 300,50 L 400,0 M 500,50 L 600,0 M 700,50 L 800,0" />
  </g>

  <!-- ================= SERVER RACK (LEFT) ================= -->
  <g transform="translate(60, 80)">
    <!-- Main Frame -->
    <rect width="220" height="380" rx="6" fill="#141821" stroke="url(#rack-border)" stroke-width="2" />
    <rect x="10" y="10" width="200" height="360" fill="#0D0F12" rx="4" />
    
    <!-- Rack Units (Blade Servers) -->
    <!-- Unit 1: Switch -->
    <rect x="20" y="25" width="180" height="30" fill="#1C2333" rx="2" stroke="#0066FF" stroke-width="0.5" />
    <g fill="#00F0FF" filter="url(#glow-cyan)">
      <circle cx="35" cy="40" r="2" /><circle cx="43" cy="40" r="2" /><circle cx="51" cy="40" r="2" />
      <circle cx="59" cy="40" r="2" /><circle cx="67" cy="40" r="2" /><circle cx="75" cy="40" r="2" />
    </g>
    <rect x="140" y="33" width="50" height="14" fill="#0D0F12" rx="2" />
    <text x="145" y="44" fill="#00F0FF" font-family="monospace" font-size="8">10 Gbps</text>

    <!-- Unit 2: Storage Server -->
    <rect x="20" y="65" width="180" height="45" fill="#1A202C" rx="2" />
    <line x1="20" y1="87" x2="200" y2="87" stroke="#0D0F12" stroke-width="2" />
    <circle cx="35" cy="76" r="3" fill="#00F0FF" />
    <circle cx="35" cy="98" r="3" fill="#FF6B00" filter="url(#glow-orange)" />
    <!-- Drive Slots -->
    <rect x="55" y="70" width="135" height="12" fill="#0D0F12" rx="1" />
    <rect x="55" y="92" width="135" height="12" fill="#0D0F12" rx="1" />

    <!-- Unit 3: Core Router -->
    <rect x="20" y="120" width="180" height="60" fill="#1C2333" rx="2" stroke="#0066FF" stroke-opacity="0.4" />
    <rect x="30" y="130" width="70" height="40" fill="#0D0F12" rx="2" />
    <text x="35" y="145" fill="#FF6B00" font-family="monospace" font-size="7" font-weight="bold">CISCO_CORE</text>
    <text x="35" y="160" fill="#00F0FF" font-family="monospace" font-size="7">STATUS: OK</text>
    <!-- Patch Ports -->
    <g fill="#2D3748" stroke="#00F0FF" stroke-width="0.5">
      <rect x="115" y="135" width="8" height="10" rx="1" /><rect x="127" y="135" width="8" height="10" rx="1" />
      <rect x="139" y="135" width="8" height="10" rx="1" /><rect x="151" y="135" width="8" height="10" rx="1" />
      <rect x="163" y="135" width="8" height="10" rx="1" /><rect x="175" y="135" width="8" height="10" rx="1" />
    </g>

    <!-- Unit 4, 5, 6: Standard Servers -->
    <rect x="20" y="190" width="180" height="35" fill="#1A202C" rx="2" />
    <circle cx="35" cy="207" r="3" fill="#00F0FF" filter="url(#glow-cyan)" />
    
    <rect x="20" y="235" width="180" height="35" fill="#1A202C" rx="2" />
    <circle cx="35" cy="252" r="3" fill="#00F0FF" filter="url(#glow-cyan)" />

    <rect x="20" y="280" width="180" height="70" fill="#141821" rx="2" stroke="#FF6B00" stroke-opacity="0.5" />
    <text x="30" y="300" fill="#F0F4F8" font-family="monospace" font-size="9" font-weight="bold">FIREWALL // MAIN</text>
    <!-- Status Graph -->
    <path d="M 30,335 L 50,335 L 60,320 L 70,340 L 80,328 L 90,335 L 180,335" fill="none" stroke="#FF6B00" stroke-width="1.5" filter="url(#glow-orange)" />
  </g>

  <!-- ================= MONITORING DASHBOARD (CENTER/RIGHT) ================= -->
  <!-- Main Display Frame -->
  <g transform="translate(340, 80)">
    <rect width="600" height="320" rx="10" fill="#121620" stroke="#0066FF" stroke-width="2" />
    <!-- Header Bar -->
    <path d="M 0,10 Q 0,0 10,0 L 590,0 Q 600,0 600,10 L 600,35 L 0,35 Z" fill="#1A202C" />
    <circle cx="20" cy="17" r="5" fill="#FF6B00" />
    <circle cx="35" cy="17" r="5" fill="#0066FF" />
    <circle cx="50" cy="17" r="5" fill="#00F0FF" />
    <text x="75" y="22" fill="#F0F4F8" font-family="monospace" font-size="11" font-weight="bold">NETWORK_OPERATIONS_CENTER // ZAKARIA_ADMIN</text>
    <text x="470" y="22" fill="#00F0FF" font-family="monospace" font-size="10">SYS_TIME: 2026.09.26</text>

    <!-- Dashboard Grid Content -->
    <!-- Card 1: Network Topology Map -->
    <rect x="20" y="50" width="340" height="150" fill="#0D0F12" rx="6" stroke="#0066FF" stroke-opacity="0.3" />
    <text x="30" y="68" fill="#00F0FF" font-family="sans-serif" font-size="10" font-weight="bold">LIVE TOPOLOGY MAP</text>
    
    <!-- Topology Nodes -->
    <g stroke="#0066FF" stroke-width="1.5" opacity="0.8">
      <line x1="190" y1="120" x2="100" y2="95" />
      <line x1="190" y1="120" x2="100" y2="155" />
      <line x1="190" y1="120" x2="280" y2="95" />
      <line x1="190" y1="120" x2="280" y2="155" />
    </g>
    <!-- Active Datastream to Alert Node -->
    <line x1="190" y1="120" x2="280" y2="155" stroke="#FF6B00" stroke-width="2" stroke-dasharray="4 3" filter="url(#glow-orange)" />

    <!-- Nodes graphics -->
    <circle cx="190" cy="120" r="16" fill="#161B22" stroke="#00F0FF" stroke-width="2" />
    <text x="180" y="124" fill="#00F0FF" font-family="monospace" font-size="8" font-weight="bold">CORE</text>

    <circle cx="100" cy="95" r="10" fill="#161B22" stroke="#0066FF" stroke-width="2" />
    <circle cx="100" cy="155" r="10" fill="#161B22" stroke="#0066FF" stroke-width="2" />
    <circle cx="280" cy="95" r="10" fill="#161B22" stroke="#0066FF" stroke-width="2" />
    
    <!-- Alert Node -->
    <circle cx="280" cy="155" r="12" fill="#FF6B00" filter="url(#glow-orange)" />
    <circle cx="280" cy="155" r="6" fill="#0D0F12" />

    <!-- Card 2: Traffic Analytics (Chart) -->
    <rect x="375" y="50" width="205" height="150" fill="#0D0F12" rx="6" stroke="#0066FF" stroke-opacity="0.3" />
    <text x="385" y="68" fill="#00F0FF" font-family="sans-serif" font-size="10" font-weight="bold">BANDWIDTH LOAD</text>
    <!-- Graph Lines -->
    <path d="M 385,170 Q 420,150 450,160 T 510,110 T 570,85" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow-cyan)" />
    <path d="M 385,170 Q 420,165 450,140 T 510,135 T 570,120" fill="none" stroke="#FF6B00" stroke-width="2" filter="url(#glow-orange)" />
    <!-- Graph Grid -->
    <line x1="385" y1="180" x2="570" y2="180" stroke="#2D3748" stroke-width="1" />
    <line x1="385" y1="80" x2="385" y2="180" stroke="#2D3748" stroke-width="1" />

    <!-- Card 3: Terminal Console -->
    <rect x="20" y="210" width="560" height="95" fill="#05070A" rx="6" stroke="#00F0FF" stroke-opacity="0.4" />
    <g font-family="monospace" font-size="10">
      <text x="35" y="230" fill="#00F0FF">root@zakaria-admin:~# <tspan fill="#F0F4F8">systemctl status network.service</tspan></text>
      <text x="35" y="248" fill="#F0F4F8">• network.service - LSB: Bring up/down networking</text>
      <text x="35" y="263" fill="#00F0FF">   Loaded: loaded (/etc/init.d/networking; bad)</text>
      <text x="35" y="278" fill="#FF6B00" font-weight="bold">   Active: active (running) since Sat 2026-09-26 17:15:00 CEST; 3h ago</text>
      <text x="35" y="293" fill="#00F0FF">root@zakaria-admin:~# <tspan fill="#FF6B00" filter="url(#glow-orange)">_</tspan></text>
    </g>
  </g>

  <!-- ================= INTERCONNECTING CABLES (DYNAMIC CABLES) ================= -->
  <!-- Glowing Cable Patch from Rack to Screen -->
  <g fill="none" stroke-linecap="round">
    <!-- Blue Data Cables -->
    <path d="M 260,140 C 300,140 290,430 360,430 L 920,430 C 940,430 950,420 950,400" stroke="#0066FF" stroke-width="4" opacity="0.8" />
    <path d="M 260,145 C 295,145 285,435 355,435 L 915,435" stroke="#00F0FF" stroke-width="2" filter="url(#glow-cyan)" />

    <!-- Orange Heavy Datastream Cable -->
    <path d="M 260,360 C 320,360 310,450 380,450 L 880,450 C 910,450 930,430 930,400" stroke="#FF6B00" stroke-width="5" filter="url(#glow-orange)" />
    <path d="M 260,360 C 320,360 310,450 380,450 L 880,450" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="12 20" />
  </g>

  <!-- Desk Base Glow -->
  <ellipse cx="640" cy="410" rx="280" ry="10" fill="#0066FF" opacity="0.15" filter="url(#glow-cyan)" />
</svg>
