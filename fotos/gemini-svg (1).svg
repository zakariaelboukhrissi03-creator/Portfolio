<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0D0F12" />

  <!-- Terminal Window -->
  <rect x="50" y="40" width="700" height="370" rx="10" fill="#161B22" stroke="#0066FF" stroke-width="2" />
  
  <!-- Window Controls -->
  <circle cx="80" cy="65" r="6" fill="#FF6B00" />
  <circle cx="100" cy="65" r="6" fill="#0066FF" />
  <circle cx="120" cy="65" r="6" fill="#00F0FF" />

  <!-- Terminal Text -->
  <g font-family="monospace" font-size="18" font-weight="bold">
    <text x="80" y="120" fill="#00F0FF">zakaria@sysadmin-node:~$ <tspan fill="#F0F4F8">init_network_status</tspan></text>
    <text x="80" y="160" fill="#F0F4F8">[OK] Firewall Active</text>
    <text x="80" y="190" fill="#F0F4F8">[OK] Cisco Gateway 192.168.1.1 Connected</text>
    <text x="80" y="230" fill="#FF6B00">[ALERT] Port 23 Traffic Spike Detected</text>
    <text x="80" y="270" fill="#00F0FF">zakaria@sysadmin-node:~$ <tspan fill="#FF6B00">_</tspan></text>
  </g>
</svg>
