<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Achtergrond Gradiënt -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F12" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Blauwe Gradiënt voor het Netwerk -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Gloei-effecten -->
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Donkere Achtergrondkaart -->
  <rect width="600" height="200" rx="16" fill="url(#bg-grad)" stroke="#0066FF" stroke-opacity="0.3" stroke-width="2"/>

  <!-- LOGO ICON (Linkerkant: Netwerk-Z met Nodes) -->
  <g transform="translate(40, 35)">
    <!-- Subtiel Achtergrond-grid -->
    <path d="M0,20 L130,20 M0,65 L130,65 M0,110 L130,110" stroke="#0066FF" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 4" />
    
    <!-- Netwerk Lijnen (De Z-Vorm) -->
    <path d="M 20,20 L 110,20 L 20,110 L 110,110" 
          fill="none" 
          stroke="url(#blue-grad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow-blue)" />

    <!-- Oranje Datastroom / Puls -->
    <path d="M 65,65 L 110,110" 
          fill="none" 
          stroke="#FF6B00" 
          stroke-width="12" 
          stroke-linecap="round" 
          filter="url(#glow-orange)" />

    <!-- Netwerk Nodes (Bollen op de hoekpunten) -->
    <circle cx="20" cy="20" r="9" fill="#0D0F12" stroke="#00F0FF" stroke-width="4" />
    <circle cx="110" cy="20" r="9" fill="#0D0F12" stroke="#00F0FF" stroke-width="4" />
    <circle cx="20" cy="110" r="9" fill="#0D0F12" stroke="#00F0FF" stroke-width="4" />
    
    <!-- Actieve Oranje Server-Node -->
    <circle cx="110" cy="110" r="10" fill="#FF6B00" filter="url(#glow-orange)" />
    <circle cx="110" cy="110" r="4" fill="#FFFFFF" />
  </g>

  <!-- TYPOGRAFIE (Rechterkant) -->
  <!-- Naam: ZAKARIA -->
  <text x="200" y="92" 
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="46" 
        fill="#F0F4F8" 
        letter-spacing="4">ZAKARIA</text>

  <!-- Functie: SYSTEM & NETWORK ADMIN -->
  <text x="202" y="125" 
        font-family="'Courier New', monospace" 
        font-weight="700" 
        font-size="16" 
        fill="#00F0FF" 
        letter-spacing="2">SYS &amp; NETWORK ADMIN</text>

  <!-- CLI Accent Details -->
  <text x="202" y="148" 
        font-family="'Courier New', monospace" 
        font-size="12" 
        fill="#FF6B00" 
        font-weight="bold">[PORT: 23 // ONLINE]</text>
</svg>
